    <!-- Median / GoNative configuration -->
    <meta name="median-statusbar-style" content="dark" />
    <meta name="median-pull-to-refresh" content="false" />
    <meta name="median-swipe-gestures" content="false" />

    <script>
      // Only load OneSignal Web SDK when NOT inside a Median native wrapper.
      // Median handles OneSignal push natively; the web SDK would block the
      // native permission prompt and cause conflicts.
      var ua = navigator.userAgent.toLowerCase();
      if (typeof window.median === 'undefined' && !ua.includes('median') && !ua.includes('gonative')) {
        var s = document.createElement('script');
        s.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
        s.defer = true;
        document.head.appendChild(s);

        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
          await OneSignal.init({
            appId: "93df44e8-2b4f-4150-947a-5469de1905a8",
          });
        });
      }
    </script>
